name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 runs the .ts test files directly via native type stripping,
          # so there is no compile step before the suite.
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm test

  bundles:
    name: dist/ and docs/ match src/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      # Rebuilds and fails if the committed bundles have drifted from src/.
      # GitHub Pages serves docs/ straight from the branch, so stale output ships.
      - run: npm run build:check
